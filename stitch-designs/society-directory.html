<script>
  // Tab Switcher Logic
  function switchTab(tabId) {
    const tabs = ['committee', 'operations', 'emergency'];
    
    tabs.forEach(t => {
      const content = document.getElementById('tab-' + t);
      const btn = document.getElementById('tab-btn-' + t);
      
      if (t === tabId) {
        content.classList.remove('hidden');
        btn.className = 'tab-btn shrink-0 px-5 py-3 rounded-xl font-label-md text-label-md transition-all bg-primary text-on-primary shadow-sm';
      } else {
        content.classList.add('hidden');
        btn.className = 'tab-btn shrink-0 px-5 py-3 rounded-xl font-label-md text-label-md transition-all bg-surface-container-low text-ink-soft hover:bg-gold-soft hover:text-primary';
      }
    });

    // Reset search on tab change
    const searchInput = document.getElementById('directorySearch');
    if (searchInput) {
      searchInput.value = '';
      filterCards('');
    }
  }

  // Copy to Clipboard Feedback
  function copyToClipboard(text, triggerEl) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('Copied: ' + text);
      const icon = triggerEl.querySelector('.material-symbols-outlined');
      if (icon) {
        const originalText = icon.textContent;
        icon.textContent = 'done';
        setTimeout(() => {
          icon.textContent = originalText;
        }, 1500);
      }
    }).catch(err => {
      showToast('Could not copy number');
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('copyToast');
    const toastMsg = document.getElementById('toastMessage');
    toastMsg.textContent = msg;
    toast.classList.remove('translate-y-20', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');
    
    setTimeout(() => {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-20', 'opacity-0');
    }, 2400);
  }

  // Real-time search across active cards
  const searchInput = document.getElementById('directorySearch');
  searchInput.addEventListener('input', (e) => {
    filterCards(e.target.value.toLowerCase().trim());
  });

  function filterCards(query) {
    const cards = document.querySelectorAll('.committee-card, .operations-card, .emergency-card');
    cards.forEach(card => {
      const text = card.textContent.toLowerCase();
      if (!query || text.includes(query)) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  }
