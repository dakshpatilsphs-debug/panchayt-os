<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1.0" name="viewport"/><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_13 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_13" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_13');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Interactive Architectural 3D Society Simulation for Royal Palms Enclave
// Supports responsive viewport, raycasting, interactive flat selection, and perimeter car animation

const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 550;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1318);
scene.fog = new THREE.FogExp2(0x0e1318, 0.012);

const camera = new THREE.PerspectiveCamera(45, width / height, 0.5, 1000);
camera.position.set(48, 38, 54);
camera.lookAt(0, 10, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

container.style.position = 'relative';
container.appendChild(renderer.domElement);

// Lighting Setup: Evening golden-hour & architectural accents
const ambientLight = new THREE.AmbientLight(0xd9e4f0, 0.85);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffecd2, 1.8);
sunLight.position.set(60, 90, 40);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 10;
sunLight.shadow.camera.far = 220;
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const goldFill = new THREE.DirectionalLight(0xb4831d, 0.6);
goldFill.position.set(-40, 25, -30);
scene.add(goldFill);

// Ground & Society Landscape
const groundGeo = new THREE.PlaneGeometry(160, 160);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x161c22,
  roughness: 0.9,
  metalness: 0.1
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Central Courtyard / Podium Greenery
const lawnGeo = new THREE.BoxGeometry(46, 0.6, 38);
const lawnMat = new THREE.MeshStandardMaterial({ color: 0x1d3324, roughness: 0.8 });
const lawn = new THREE.Mesh(lawnGeo, lawnMat);
lawn.position.set(0, 0.3, 0);
lawn.receiveShadow = true;
scene.add(lawn);

// Swimming Pool
const poolGeo = new THREE.BoxGeometry(16, 0.3, 8);
const poolMat = new THREE.MeshStandardMaterial({
  color: 0x0ea5e9,
  roughness: 0.15,
  metalness: 0.4
});
const pool = new THREE.Mesh(poolGeo, poolMat);
pool.position.set(0, 0.65, 8);
scene.add(pool);

// Clubhouse Pavilion
const clubGeo = new THREE.BoxGeometry(18, 4, 12);
const clubMat = new THREE.MeshStandardMaterial({ color: 0xf4f1ea, roughness: 0.3 });
const club = new THREE.Mesh(clubGeo, clubMat);
club.position.set(0, 2, -6);
club.castShadow = true;
club.receiveShadow = true;
scene.add(club);

// Society Entrance Gate & Sign
const gateArchGeo = new THREE.BoxGeometry(22, 5.5, 2.5);
const gateArchMat = new THREE.MeshStandardMaterial({ color: 0x22262a, roughness: 0.4 });
const gateArch = new THREE.Mesh(gateArchGeo, gateArchMat);
gateArch.position.set(0, 2.75, 42);
gateArch.castShadow = true;
scene.add(gateArch);

// Trees in Courtyard & Boundaries
const treeTrunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 8);
const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525 });
const treeLeavesGeo = new THREE.SphereGeometry(1.6, 8, 8);
const treeLeavesMat = new THREE.MeshStandardMaterial({ color: 0x22543d, roughness: 0.7 });

const treeCoords = [
  [-16, 6], [-16, 14], [-12, 16], [16, 6], [16, 14], [12, 16],
  [-22, 28], [22, 28], [-22, 38], [22, 38], [-35, 0], [35, 0],
  [-35, -20], [35, -20], [0, -22]
];
treeCoords.forEach(([tx, tz]) => {
  const trunk = new THREE.Mesh(treeTrunkGeo, treeTrunkMat);
  trunk.position.set(tx, 1, tz);
  trunk.castShadow = true;
  const foliage = new THREE.Mesh(treeLeavesGeo, treeLeavesMat);
  foliage.position.set(tx, 2.8, tz);
  foliage.castShadow = true;
  scene.add(trunk);
  scene.add(foliage);
});

// Tower Configuration (Wings A, B, C)
const towers = [
  { name: 'Wing A', x: -20, z: -8, floors: 10, color: 0xf9f9f8, roofColor: 0xb4831d },
  { name: 'Wing B', x: 20, z: -8, floors: 12, color: 0xf7f5f0, roofColor: 0x926715 },
  { name: 'Wing C', x: 0, z: -26, floors: 14, color: 0xfbfbfb, roofColor: 0xb4831d }
];

const interactiveWindows = [];
const windowMatClear = new THREE.MeshStandardMaterial({
  color: 0x10b981,
  emissive: 0x059669,
  emissiveIntensity: 0.65,
  roughness: 0.2
});
const windowMatDue = new THREE.MeshStandardMaterial({
  color: 0xf43f5e,
  emissive: 0xe11d48,
  emissiveIntensity: 0.85,
  roughness: 0.2
});
const windowMatSelected = new THREE.MeshStandardMaterial({
  color: 0xfbbf24,
  emissive: 0xd97706,
  emissiveIntensity: 1.2,
  roughness: 0.1
});
const windowMatLit = new THREE.MeshStandardMaterial({
  color: 0xffedd5,
  emissive: 0xfbbf24,
  emissiveIntensity: 0.45,
  roughness: 0.3
});

towers.forEach((tw) => {
  const towerHeight = tw.floors * 3.4;
  const towerBodyGeo = new THREE.BoxGeometry(14, towerHeight, 14);
  const towerMat = new THREE.MeshStandardMaterial({
    color: tw.color,
    roughness: 0.4,
    metalness: 0.05
  });
  const towerMesh = new THREE.Mesh(towerBodyGeo, towerMat);
  towerMesh.position.set(tw.x, towerHeight / 2, tw.z);
  towerMesh.castShadow = true;
  towerMesh.receiveShadow = true;
  scene.add(towerMesh);

  // Decorative Penthouse / Water Tank Roof
  const roofGeo = new THREE.BoxGeometry(10, 3, 10);
  const roofMat = new THREE.MeshStandardMaterial({ color: tw.roofColor, roughness: 0.3, metalness: 0.2 });
  const roofMesh = new THREE.Mesh(roofGeo, roofMat);
  roofMesh.position.set(tw.x, towerHeight + 1.5, tw.z);
  roofMesh.castShadow = true;
  scene.add(roofMesh);

  // Architectural vertical gold fins
  const finGeo = new THREE.BoxGeometry(0.3, towerHeight, 1.2);
  const finMat = new THREE.MeshStandardMaterial({ color: 0xb4831d, metalness: 0.5, roughness: 0.2 });
  [-6.8, 6.8].forEach(fx => {
    const fin = new THREE.Mesh(finGeo, finMat);
    fin.position.set(tw.x + fx, towerHeight / 2, tw.z);
    scene.add(fin);
  });

  // Windows per floor with interactive raycastable meshes
  for (let f = 1; f <= tw.floors; f++) {
    const yPos = (f * 3.4) - 1.2;
    const isDue = (tw.name === 'Wing A' && (f === 1 || f === 4 || f === 6)) ||
                  (tw.name === 'Wing B' && (f === 2 || f === 5)) ||
                  (tw.name === 'Wing C' && f === 3);
    const isSelected = (tw.name === 'Wing A' && f === 4);

    // Front facing balconies and windows
    const winGeo = new THREE.BoxGeometry(2.4, 1.8, 0.4);
    [-4, 4].forEach((wx, idx) => {
      let activeMat = isSelected ? windowMatSelected : (isDue ? windowMatDue : (Math.random() > 0.3 ? windowMatLit : windowMatClear));
      const winMesh = new THREE.Mesh(winGeo, activeMat);
      winMesh.position.set(tw.x + wx, yPos, tw.z + 7.1);
      winMesh.castShadow = false;

      // Meta for flat identification
      const flatNum = `${tw.name[5]}-${f}0${idx + 1}`;
      winMesh.userData = {
        flat: flatNum,
        wing: tw.name,
        floor: f,
        isDue: isDue,
        isSelected: isSelected
      };
      interactiveWindows.push(winMesh);
      scene.add(winMesh);

      // Balcony Railing
      const balcGeo = new THREE.BoxGeometry(3.2, 0.8, 1.0);
      const balcMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 });
      const balc = new THREE.Mesh(balcGeo, balcMat);
      balc.position.set(tw.x + wx, yPos - 0.7, tw.z + 7.6);
      balc.castShadow = true;
      scene.add(balc);
    });
  }
});

// Realistic Perimeter Roads & Moving Vehicles
const roadMat = new THREE.MeshStandardMaterial({ color: 0x181c20, roughness: 0.7 });

// Outer Loop Roadways
const roadGeoNS = new THREE.BoxGeometry(7, 0.08, 96);
const roadWest = new THREE.Mesh(roadGeoNS, roadMat);
roadWest.position.set(-36, 0.04, 8);
scene.add(roadWest);

const roadEast = new THREE.Mesh(roadGeoNS, roadMat);
roadEast.position.set(36, 0.04, 8);
scene.add(roadEast);

const roadGeoEW = new THREE.BoxGeometry(79, 0.08, 7);
const roadSouth = new THREE.Mesh(roadGeoEW, roadMat);
roadSouth.position.set(0, 0.04, 46);
scene.add(roadSouth);

const roadNorth = new THREE.Mesh(roadGeoEW, roadMat);
roadNorth.position.set(0, 0.04, -38);
scene.add(roadNorth);

// Animated Vehicle Fleet
const vehicleColors = [0xef4444, 0x3b82f6, 0xffffff, 0xb4831d, 0x10b981];
const vehicles = [];

function createCar(colorHex) {
  const carGroup = new THREE.Group();
  // Chassis
  const bodyGeo = new THREE.BoxGeometry(2.4, 0.9, 1.3);
  const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.4, roughness: 0.2 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.6;
  body.castShadow = true;
  carGroup.add(body);

  // Cabin
  const cabinGeo = new THREE.BoxGeometry(1.4, 0.65, 1.15);
  const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.1 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(-0.2, 1.2, 0);
  carGroup.add(cabin);

  // Headlights
  const lightGeo = new THREE.BoxGeometry(0.1, 0.2, 0.3);
  const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const headL = new THREE.Mesh(lightGeo, headMat);
  headL.position.set(1.22, 0.6, 0.35);
  const headR = new THREE.Mesh(lightGeo, headMat);
  headR.position.set(1.22, 0.6, -0.35);
  carGroup.add(headL);
  carGroup.add(headR);

  // Tail lights
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
  const tailL = new THREE.Mesh(lightGeo, tailMat);
  tailL.position.set(-1.22, 0.6, 0.35);
  const tailR = new THREE.Mesh(lightGeo, tailMat);
  tailR.position.set(-1.22, 0.6, -0.35);
  carGroup.add(tailL);
  carGroup.add(tailR);

  return carGroup;
}

// Perimeter Waypoints for Car Circulation
const carLoopWaypoints = [
  { x: -36, z: 46 },
  { x: 36, z: 46 },
  { x: 36, z: -38 },
  { x: -36, z: -38 }
];

// Initialize 5 distinct circulating cars
for (let i = 0; i < 5; i++) {
  const car = createCar(vehicleColors[i % vehicleColors.length]);
  scene.add(car);
  vehicles.push({
    mesh: car,
    progress: (i / 5),
    speed: 0.00075 + (i * 0.00015)
  });
}

function updateVehicles() {
  const totalLength = 72 + 84 + 72 + 84; // Perimeter loop length
  vehicles.forEach(v => {
    v.progress = (v.progress + v.speed) % 1.0;
    const currentDist = v.progress * totalLength;

    if (currentDist < 72) {
      // Moving South: -36 to +36 along z=46
      const t = currentDist / 72;
      v.mesh.position.set(-36 + (72 * t), 0, 46);
      v.mesh.rotation.y = 0;
    } else if (currentDist < 156) {
      // Moving North along East road: z=46 to z=-38
      const t = (currentDist - 72) / 84;
      v.mesh.position.set(36, 0, 46 - (84 * t));
      v.mesh.rotation.y = Math.PI / 2;
    } else if (currentDist < 228) {
      // Moving West along North road: x=36 to x=-36 at z=-38
      const t = (currentDist - 156) / 72;
      v.mesh.position.set(36 - (72 * t), 0, -38);
      v.mesh.rotation.y = Math.PI;
    } else {
      // Moving South along West road: z=-38 to z=46
      const t = (currentDist - 228) / 84;
      v.mesh.position.set(-36, 0, -38 + (84 * t));
      v.mesh.rotation.y = -Math.PI / 2;
    }
  });
}

// Raycasting for Flat Selection
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

container.addEventListener('click', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(interactiveWindows);

  if (intersects.length > 0) {
    const target = intersects[0].object;
    if (target.userData && target.userData.flat) {
      // Reset all windows
      interactiveWindows.forEach(w => {
        w.material = w.userData.isDue ? windowMatDue : windowMatClear;
      });
      // Highlight clicked
      target.material = windowMatSelected;

      // Dispatch custom window event to sync with UI
      const selectEvent = new CustomEvent('flat-3d-selected', {
        detail: {
          flat: target.userData.flat,
          wing: target.userData.wing,
          floor: target.userData.floor
        }
      });
      window.dispatchEvent(selectEvent);
    }
  }
});

// Interactive Orbit / Drag rotation
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let targetRotationY = 0;
let currentRotationY = 0;

container.addEventListener('mousedown', (e) => {
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  isDragging = false;
});

window.addEventListener('mousemove', (e) => {
  if (isDragging) {
    const deltaX = e.clientX - previousMousePosition.x;
    targetRotationY += deltaX * 0.006;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  }
});

// Window Resize Handling
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 550;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Main Animation Loop
function animate() {
  requestAnimationFrame(animate);

  // Smooth rotation dampening
  currentRotationY += (targetRotationY - currentRotationY) * 0.05;
  scene.rotation.y = currentRotationY;

  // Orbit camera slight gentle sway when idle
  if (!isDragging) {
    targetRotationY += 0.0006;
  }

  updateVehicles();
  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_13 -->
</body>
</html>
