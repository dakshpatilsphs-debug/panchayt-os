      document.getElementById('openCsvExportBtn').addEventListener('click', () => csvModal.classList.remove('hidden'));
      document.getElementById('closeCsvModalBtn').addEventListener('click', () => csvModal.classList.add('hidden'));
      document.getElementById('cancelCsvModalBtn').addEventListener('click', () => csvModal.classList.add('hidden'));

      // Download Toast Simulation
      document.getElementById('downloadCsvBtn').addEventListener('click', () => {
        const btn = document.getElementById('downloadCsvBtn');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Generating Audit Zip...';
        setTimeout(() => {
          btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> Package Downloaded';
          setTimeout(() => {
            csvModal.classList.add('hidden');
            btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">download_for_offline</span> Download .XLSX Package';
          }, 900);
        }, 1200);
      });

      // Quick Inspection Sync
      const viewButtons = document.querySelectorAll('.view-utr-btn');
      const inspectorFlatTitle = document.getElementById('inspectorFlatTitle');
      const inspectorPayer = document.getElementById('inspectorPayer');
      const inspectorUtr = document.getElementById('inspectorUtr');
      const inspectorAmount = document.getElementById('inspectorAmount');
      const inspectorTimestamp = document.getElementById('inspectorTimestamp');
      const inspectorStatusBadge = document.getElementById('inspectorStatusBadge');

      viewButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const flat = btn.getAttribute('data-flat');
          const utr = btn.getAttribute('data-utr');
          const amt = btn.getAttribute('data-amt');
          const verdict = btn.getAttribute('data-verdict');
          const payer = btn.getAttribute('data-payer');
          const time = btn.getAttribute('data-time');

          inspectorFlatTitle.textContent = 'Wing ' + flat.split('-')[0] + ' • Flat ' + flat.split('-')[1];
          inspectorPayer.textContent = payer;
          inspectorUtr.textContent = utr;
          inspectorAmount.textContent = amt;
          inspectorTimestamp.textContent = 'Captured ' + time;
          inspectorStatusBadge.textContent = verdict;

      // Action Handlers on Table Rows (Verify & Credit / Reject)
      const verifyBtns = document.querySelectorAll('.btn-verify');
      const rejectBtns = document.querySelectorAll('.btn-reject');

      verifyBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const row = e.target.closest('tr');
          const flat = row.getAttribute('data-flat');
          const actionContainer = row.querySelector('.action-container');
          
          btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[14px]">progress_activity</span> Crediting...';
          setTimeout(() => {
            row.classList.remove('bg-gold-soft/20');
            row.classList.add('bg-surface-soft/40');
            if (actionContainer) {
              actionContainer.innerHTML = '<span class="font-code-md text-[12px] text-success font-semibold flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">check_circle</span> Credited #RP-' + Math.floor(1000 + Math.random() * 9000) + '</span>';
            }
          }, 800);
        });
      });

      rejectBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const row = e.target.closest('tr');
          const actionContainer = row.querySelector('.action-container');
          if (confirm('Are you sure you want to flag this UTR submission for resident re-upload?')) {
            row.style.opacity = '0.5';
            if (actionContainer) {
              actionContainer.innerHTML = '<span class="font-label-sm text-[12px] text-error font-semibold">Rejected &amp; SMS Sent</span>';
            }
          }
        });
      });

      // Inspector Direct Verification
      const inspectVerifyBtn = document.getElementById('inspectVerifyBtn');
      inspectVerifyBtn.addEventListener('click', () => {
        inspectVerifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span> Approving Target...';
        setTimeout(() => {
          inspectVerifyBtn.innerHTML = '<span class="material-symbols-outlined text-[16px]">task_alt</span> Verified on Ledger';
          inspectVerifyBtn.classList.remove('bg-primary');
          inspectVerifyBtn.classList.add('bg-success');
        }, 900);
      });

      // Filter search
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('#queueTableBody tr');
        rows.forEach(r => {
          const text = r.innerText.toLowerCase();
          r.style.display = text.includes(query) ? '' : 'none';
        });
      });

      // Auto Match All
      document.getElementById('autoMatchAllBtn').addEventListener('click', () => {
        const btn = document.getElementById('autoMatchAllBtn');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">autorenew</span> Reconciling 3 Items...';
        setTimeout(() => {
          stmtModal.classList.add('hidden');
          btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">done_all</span> Auto-Reconcile Matches';
          alert('Reconciliation Complete: 3 UTR hashes successfully settled against HDFC Society Current Ledger.');
        }, 1100);
      });

    })();
  </script>
